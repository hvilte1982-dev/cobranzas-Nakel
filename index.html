<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f766e">
<title>Cobranzas · NAKEL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --primary:hsl(172,60%,30%); --primary-light:hsl(172,45%,92%); --primary-dark:hsl(172,65%,22%);
  --success:hsl(145,55%,42%); --danger:hsl(0,70%,55%); --warn:hsl(38,90%,50%);
  --bg-main:hsl(200,20%,97%); --bg-card:#fff; --text-main:hsl(210,15%,15%);
  --text-muted:hsl(210,10%,45%); --border:hsl(210,15%,89%); --shadow:0 4px 10px -4px rgba(0,0,0,.12);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Outfit',sans-serif;background:hsl(210,20%,88%);color:var(--text-main);min-height:100vh}
#app{display:none;flex-direction:column;min-height:100vh;width:100%;max-width:520px;margin:0 auto;background:var(--bg-main);position:relative}
body.admin #app{max-width:1040px}
header{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;background:var(--primary);color:#fff;position:sticky;top:0;z-index:100}
header h1{font-size:1.05rem;font-weight:600;line-height:1.2}
header small{opacity:.8;font-size:.72rem;display:block;font-weight:300}
.icon-btn{width:36px;height:36px;border-radius:10px;border:none;background:rgba(255,255,255,.18);color:#fff;cursor:pointer;font-size:.9rem}
main{flex:1;padding:16px 16px 90px}
nav{position:sticky;bottom:0;height:66px;background:var(--bg-card);border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;z-index:100}
.nav-item{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-muted);font-size:.68rem;font-family:inherit;cursor:pointer;padding:6px}
.nav-item i{font-size:1.15rem}
.nav-item.active{color:var(--primary);font-weight:600}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{font-size:.95rem;margin-bottom:12px;display:flex;align-items:center;gap:8px}
label{display:block;font-size:.75rem;color:var(--text-muted);margin:10px 0 4px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.input,select,textarea{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;font-family:inherit;font-size:1rem;background:var(--bg-card);color:var(--text-main)}
.input:focus,select:focus{outline:2px solid var(--primary-light);border-color:var(--primary)}
.btn{width:100%;padding:14px;border:none;border-radius:12px;background:var(--primary);color:#fff;font-family:inherit;font-size:1rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.99)}
.btn.sec{background:var(--bg-main);color:var(--text-main);border:1px solid var(--border)}
.btn.dan{background:var(--danger)}
.btn.sm{width:auto;padding:8px 14px;font-size:.82rem;border-radius:9px}
.row{display:flex;gap:10px}.row>*{flex:1}
.kpi{background:var(--primary);color:#fff;border-radius:16px;padding:18px;margin-bottom:14px}
.kpi .big{font-size:2rem;font-weight:700;letter-spacing:-.02em}
.kpi .lbl{font-size:.78rem;opacity:.85}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.mini{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:12px}
.mini .v{font-size:1.25rem;font-weight:700}
.mini .l{font-size:.7rem;color:var(--text-muted);text-transform:uppercase}
.item{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.item .nm{font-weight:600;font-size:.9rem}
.item .dt{font-size:.72rem;color:var(--text-muted)}
.item .am{font-weight:700;font-size:1rem;white-space:nowrap}
.tag{display:inline-block;font-size:.62rem;padding:2px 7px;border-radius:20px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.t-pendiente{background:hsl(38,90%,92%);color:hsl(38,90%,30%)}
.t-rendido{background:hsl(210,90%,93%);color:hsl(210,80%,35%)}
.t-exportado{background:hsl(145,55%,90%);color:hsl(145,55%,25%)}
.t-anulado{background:hsl(0,70%,94%);color:hsl(0,70%,40%)}
.t-offline{background:hsl(280,60%,93%);color:hsl(280,60%,35%)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;align-items:flex-end;justify-content:center}
.modal-box{background:var(--bg-card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px;max-height:88vh;overflow-y:auto}
body.admin .modal{align-items:center}
body.admin .modal-box{border-radius:18px;max-width:640px}
.cli{padding:11px;border-bottom:1px solid var(--border);cursor:pointer}
.cli:active{background:var(--primary-light)}
.cli b{display:block;font-size:.88rem}
.cli span{font-size:.72rem;color:var(--text-muted)}
#login{display:flex;flex-direction:column;justify-content:center;min-height:100vh;padding:26px;max-width:420px;margin:0 auto}
.logo{width:72px;height:72px;border-radius:20px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 18px}
.pin{letter-spacing:.6em;text-align:center;font-size:1.4rem}
.banner{padding:10px 14px;border-radius:10px;font-size:.8rem;margin-bottom:12px;display:none}
.b-off{background:hsl(38,90%,92%);color:hsl(38,90%,28%);display:block}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--border)}
th{font-size:.68rem;text-transform:uppercase;color:var(--text-muted)}
td.n,th.n{text-align:right}
.scroll{overflow-x:auto}
.empty{text-align:center;color:var(--text-muted);padding:30px 10px;font-size:.85rem}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{height:0}
.chip{flex:0 0 auto;padding:8px 13px;border-radius:20px;border:1px solid var(--border);background:var(--bg-card);
  font-family:inherit;font-size:.8rem;font-weight:600;color:var(--text-muted);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--text-main);color:#fff;padding:12px 18px;border-radius:12px;font-size:.85rem;z-index:900;opacity:0;transition:.25s;pointer-events:none;max-width:90%}
.toast.on{opacity:1}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login">
  <div class="logo"><i class="fa-solid fa-hand-holding-dollar"></i></div>
  <h2 style="text-align:center;margin-bottom:4px">Cobranzas NAKEL</h2>
  <p style="text-align:center;color:var(--text-muted);font-size:.85rem;margin-bottom:22px">Ingreso de cobros en efectivo</p>
  <div class="card">
    <label>Usuario</label>
    <select id="l-user"><option>Cargando…</option></select>
    <label>PIN</label>
    <input type="password" inputmode="numeric" maxlength="6" id="l-pin" class="input pin" placeholder="····">
    <div style="height:14px"></div>
    <button class="btn" id="l-btn"><i class="fa-solid fa-right-to-bracket"></i> Entrar</button>
    <p id="l-msg" style="color:var(--danger);font-size:.8rem;text-align:center;margin-top:10px"></p>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <header>
    <div>
      <h1 id="h-name">—</h1>
      <small id="h-rol">—</small>
    </div>
    <div style="display:flex;gap:8px">
      <button class="icon-btn" onclick="sincronizar()" title="Sincronizar"><i class="fa-solid fa-rotate"></i></button>
      <button class="icon-btn" onclick="salir()" title="Salir"><i class="fa-solid fa-power-off"></i></button>
    </div>
  </header>
  <main id="view"></main>
  <nav id="nav"></nav>
</div>

<!-- ============ MODAL CLIENTES ============ -->
<div class="modal" id="m-cli" onclick="if(event.target===this)cerrar('m-cli')">
  <div class="modal-box">
    <h3 style="margin-bottom:10px">Buscar cliente</h3>
    <input class="input" id="cli-q" placeholder="Nombre, código o CUIT…" oninput="buscarClientes()" autocomplete="off">
    <p style="font-size:.72rem;color:var(--text-muted);margin:8px 0" id="cli-info"></p>
    <div id="cli-res"></div>
    <div style="height:12px"></div>
    <button class="btn sec" onclick="cerrar('m-cli')">Cerrar</button>
  </div>
</div>

<!-- ============ MODAL USUARIO ============ -->
<div class="modal" id="m-user" onclick="if(event.target===this)cerrar('m-user')">
  <div class="modal-box">
    <h3 id="u-titulo">Nuevo usuario</h3>
    <label>Usuario (para ingresar)</label>
    <input class="input" id="u-usuario" placeholder="jperez" autocomplete="off">
    <label>Nombre y apellido</label>
    <input class="input" id="u-nombre" placeholder="Juan Pérez">
    <label id="u-pin-lbl">PIN (4 a 6 dígitos)</label>
    <input class="input" id="u-pin" inputmode="numeric" maxlength="6" placeholder="····">
    <label>Rol</label>
    <select id="u-rol"><option value="vendedor">Vendedor / Repartidor</option><option value="admin">Administración</option></select>
    <label>Zona (opcional)</label>
    <input class="input" id="u-zona" placeholder="Comodoro Norte">
    <label><input type="checkbox" id="u-activo" checked style="width:auto"> Activo</label>
    <div style="height:14px"></div>
    <button class="btn" onclick="guardarUsuario()"><i class="fa-solid fa-check"></i> Guardar</button>
    <div style="height:8px"></div>
    <button class="btn sec" onclick="cerrar('m-user')">Cancelar</button>
  </div>
</div>

<!-- ============ MODAL COMPROBANTE ============ -->
<div class="modal" id="m-cmp" onclick="if(event.target===this)cerrar('m-cmp')">
  <div class="modal-box">
    <h3><i class="fa-solid fa-receipt"></i> Comprobante de rendición</h3>
    <pre id="cmp-texto" style="background:var(--bg-main);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:.78rem;white-space:pre-wrap;overflow-x:auto;font-family:ui-monospace,monospace;line-height:1.5"></pre>
    <div id="cmp-acciones"></div>
    <div style="height:8px"></div>
    <button class="btn sec" onclick="cerrar('m-cmp')">Cerrar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   CONFIGURACIÓN  ·  reemplazar por los datos de tu proyecto Supabase
   ===================================================================== */
const SUP_URL = 'https://ugsaztealewuahbliyxx.supabase.co';   // <-- proyecto NAKEL (verificar contra Supabase)
const SUP_KEY =  'sb_publishable_j7MV81AQyXCPt7JAEB0xgA_B9nkbgna';
const EMPRESA = 'NAKEL SA';
const PREFIJO_ID = 'NKL-COB';           // prefijo del ID único de importación en Odoo
const DIARIO_ODOO = 'Caja Cobranzas Efectivo';  // nombre del diario en Odoo (editable al exportar)

/* ===================================================================== */
let db = null, U = null, vista = 'nueva';
let clientes = [], clienteSel = null, cache = [], filtros = {};

const $ = id => document.getElementById(id);
const hoy = () => new Date().toISOString().slice(0,10);
const money = n => '$ ' + (Number(n)||0).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
const norm = s => (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
const uid = () => PREFIJO_ID + '-' + Date.now().toString(36).toUpperCase() + '-' + Math.random().toString(36).slice(2,6).toUpperCase();
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){ const e=$('toast'); e.textContent=t; e.classList.add('on'); setTimeout(()=>e.classList.remove('on'),2600); }
function abrir(id){ $(id).style.display='flex'; }
function cerrar(id){ $(id).style.display='none'; }

/* ============ INICIO ============ */
document.addEventListener('DOMContentLoaded', async () => {
  try { if (window.supabase) db = window.supabase.createClient(SUP_URL, SUP_KEY); }
  catch(e){ console.error('Supabase', e); }

  await cargarUsuariosLogin();
  $('l-btn').onclick = login;
  $('l-pin').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

  const s = localStorage.getItem('cob_user');
  if (s) { U = JSON.parse(s); entrar(); }

  window.addEventListener('online', () => { estadoRed(); sincronizar(true); });
  window.addEventListener('offline', estadoRed);
});

async function cargarUsuariosLogin(){
  const sel = $('l-user');
  let us = JSON.parse(localStorage.getItem('cob_usuarios') || '[]');
  if (db && navigator.onLine) {
    let r = await db.from('cob_usuarios_publicos').select('*').order('nombre');
    if (r.error) r = await db.from('cob_usuarios').select('usuario,nombre,rol,pin').eq('activo', true).order('nombre');
    if (r.data && r.data.length) { us = r.data; localStorage.setItem('cob_usuarios', JSON.stringify(r.data)); }
  }
  sel.innerHTML = us.length
    ? us.map(u => `<option value="${esc(u.usuario)}">${esc(u.nombre)}</option>`).join('')
    : '<option value="">Sin conexión / sin usuarios</option>';
  window._usuarios = us;
}

async function login(){
  const usuario = $('l-user').value, pin = String($('l-pin').value).trim();
  if (!usuario) return $('l-msg').textContent = 'Elegí un usuario.';
  if (!pin) return $('l-msg').textContent = 'Ingresá el PIN.';
  $('l-msg').textContent = 'Verificando…';
  let datos = null;
  if (db && navigator.onLine) {
    const { data, error } = await db.rpc('cob_login', { p_usuario: usuario, p_pin: pin });
    if (!error && data && data.length) datos = data[0];
    else if (!error) return $('l-msg').textContent = 'Usuario o PIN incorrecto.';
    else {
      // Respaldo: base todavía sin las funciones nuevas
      const u = (window._usuarios||[]).find(x => x.usuario === usuario);
      if (!u || !u.pin) return $('l-msg').textContent = 'No se pudo validar. Revisá la conexión.';
      if (String(u.pin).trim() !== pin) return $('l-msg').textContent = 'Usuario o PIN incorrecto.';
      datos = u;
    }
  } else {
    const s = JSON.parse(localStorage.getItem('cob_user') || 'null');
    if (!s || s.usuario !== usuario || s.pin !== pin) return $('l-msg').textContent = 'Sin conexión: solo el último usuario puede entrar.';
    datos = s;
  }
  U = { usuario: datos.usuario, nombre: datos.nombre, rol: datos.rol, zona: datos.zona||null, pin: pin };
  localStorage.setItem('cob_user', JSON.stringify(U));
  $('l-msg').textContent = '';
  entrar();
}
function salir(){ localStorage.removeItem('cob_user'); location.reload(); }

function entrar(){
  $('login').style.display = 'none';
  $('app').style.display = 'flex';
  document.body.classList.toggle('admin', U.rol === 'admin');
  $('h-name').textContent = U.nombre;
  $('h-rol').textContent = (U.rol === 'admin' ? 'Administración · ' : 'Vendedor · ') + EMPRESA;
  const items = U.rol === 'admin'
    ? [['panel','fa-chart-pie','Panel'],['recepcion','fa-hand-holding-dollar','Recepción'],['cobranzas','fa-list','Cobranzas'],['exportar','fa-file-csv','Exportar'],['datos','fa-database','Datos']]
    : [['nueva','fa-plus-circle','Cargar'],['mias','fa-list','Mis cobros'],['rendicion','fa-sack-dollar','Rendición']];
  vista = items[0][0];
  $('nav').innerHTML = items.map(i =>
    `<button class="nav-item" data-v="${i[0]}" onclick="ir('${i[0]}')"><i class="fa-solid ${i[1]}"></i>${i[2]}</button>`).join('');
  cargarClientes();
  sincronizar(true);
  ir(vista);
}
function ir(v){
  vista = v;
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.v === v));
  render();
}

/* =====================================================================
   COLA OFFLINE  ·  todo se guarda primero en el dispositivo
   ===================================================================== */
const cola = () => JSON.parse(localStorage.getItem('cob_cola') || '[]');
const setCola = a => localStorage.setItem('cob_cola', JSON.stringify(a));

async function sincronizar(silencioso){
  if (!db || !navigator.onLine) { if(!silencioso) toast('Sin conexión: los datos quedan en el equipo.'); estadoRed(); return; }
  let c = cola(), ok = 0;
  for (const r of [...c]) {
    const { error } = await db.from('cob_cobranzas').insert(r);
    if (!error || (error.message||'').includes('duplicate')) { c = c.filter(x => x.uid !== r.uid); ok++; }
  }
  setCola(c);
  await traerCobranzas();
  if (!silencioso) toast(ok ? `Sincronizadas ${ok} cobranzas.` : 'Todo al día.');
  render();
}

async function traerCobranzas(){
  if (!db || !navigator.onLine) { cache = JSON.parse(localStorage.getItem('cob_cache')||'[]'); return; }
  let q = db.from('cob_cobranzas').select('*').order('fecha',{ascending:false}).order('id',{ascending:false}).limit(1000);
  if (U.rol !== 'admin') q = q.eq('vendedor', U.usuario);
  const { data } = await q;
  if (data) { cache = data; localStorage.setItem('cob_cache', JSON.stringify(data.slice(0,300))); }
}

function estadoRed(){
  const b = $('b-red'); if (b) b.style.display = navigator.onLine ? 'none' : 'block';
}

/* =====================================================================
   CLIENTES  ·  se cachean en el dispositivo para buscar sin conexión
   ===================================================================== */
async function cargarClientes(forzar){
  clientes = JSON.parse(localStorage.getItem('cob_clientes') || '[]');
  const last = localStorage.getItem('cob_clientes_ts');
  const viejo = !last || (Date.now() - Number(last)) > 86400000;   // 24 h
  // Chequeo rápido: ¿cuántos clientes hay en el servidor? Si no coincide con lo local, refresca.
  let desincronizado = false;
  if (db && navigator.onLine) {
    const { count } = await db.from('cob_clientes').select('id', { count:'exact', head:true }).eq('activo', true);
    if (typeof count === 'number' && count !== clientes.length) desincronizado = true;
  }
  if (!db || !navigator.onLine || (!forzar && !viejo && !desincronizado && clientes.length)) return;
  let todos = [], desde = 0;
  while (true) {
    let q = db.from('cob_clientes').select('id,codigo,nombre,cuit,localidad,vendedor')
              .eq('activo', true).order('nombre').range(desde, desde + 999);
    const { data, error } = await q;
    if (error || !data || !data.length) break;
    todos = todos.concat(data);
    if (data.length < 1000) break;
    desde += 1000;
    if (todos.length > 30000) break;
  }
  if (todos.length) {
    clientes = todos;
    try {
      localStorage.setItem('cob_clientes', JSON.stringify(todos));
      localStorage.setItem('cob_clientes_ts', String(Date.now()));
    } catch(e){ toast('Cartera muy grande para guardar offline.'); }
  }
}

function abrirClientes(){ $('cli-q').value=''; $('cli-res').innerHTML=''; buscarClientes(); abrir('m-cli'); setTimeout(()=>$('cli-q').focus(),200); }

function buscarClientes(){
  const q = norm($('cli-q').value).trim();
  let base = clientes;
  if (U.rol !== 'admin') { const mios = base.filter(c => !c.vendedor || c.vendedor === U.usuario); if (mios.length) base = mios; }
  let res = q.length < 2 ? base.slice(0,25)
    : base.filter(c => norm(c.nombre).includes(q) || norm(c.codigo).includes(q) || norm(c.cuit).replace(/-/g,'').includes(q.replace(/-/g,''))).slice(0,40);
  $('cli-info').textContent = `${clientes.length} clientes en el equipo · mostrando ${res.length}`;
  $('cli-res').innerHTML = res.length ? res.map(c =>
    `<div class="cli" onclick="elegirCliente(${c.id})"><b>${esc(c.nombre)}</b><span>${esc(c.codigo||'s/cód')} · ${esc(c.localidad||'')} ${c.cuit?'· '+esc(c.cuit):''}</span></div>`).join('')
    : `<div class="empty">Sin resultados.<br><button class="btn sm sec" style="margin-top:10px" onclick="usarLibre()">Usar «${esc($('cli-q').value)}» como cliente</button></div>`;
}
function elegirCliente(id){
  clienteSel = clientes.find(c => c.id === id);
  cerrar('m-cli'); render();
}
function usarLibre(){
  const n = $('cli-q').value.trim(); if (!n) return;
  clienteSel = { id:0, codigo:'', nombre:n, cuit:'', localidad:'' };
  cerrar('m-cli'); render();
}

/* =====================================================================
   RENDER
   ===================================================================== */
function render(){
  const v = $('view');
  const foco = document.activeElement ? document.activeElement.id : '';
  const banner = `<div class="banner ${navigator.onLine?'':'b-off'}" id="b-red"><i class="fa-solid fa-wifi"></i> Sin conexión — se guarda en el equipo y se sincroniza al volver.</div>`;
  const pend = cola().length;
  const avisoCola = pend ? `<div class="card" style="border-color:var(--warn)"><b>${pend}</b> cobranza(s) sin sincronizar. <button class="btn sm" style="margin-top:8px" onclick="sincronizar()">Sincronizar ahora</button></div>` : '';
  v.innerHTML = banner + avisoCola + ({
    nueva: vNueva, mias: vMias, rendicion: vRendicion,
    panel: vPanel, recepcion: vRecepcion, cobranzas: vCobranzas, exportar: vExportar, datos: vDatos
  }[vista] || vNueva)();
  estadoRed();

async function guardar(){
  const imp = parseFloat($('f-importe').value);
  if (!clienteSel) return toast('Elegí el cliente.');
  if (!imp || imp <= 0) return toast('Ingresá un importe válido.');
  const r = {
    uid: uid(), fecha: $('f-fecha').value || hoy(),
    vendedor: U.usuario, vendedor_nombre: U.nombre,
    cliente_codigo: clienteSel.codigo || null, cliente_nombre: clienteSel.nombre,
    cliente_cuit: clienteSel.cuit || null,
    importe: Math.round(imp * 100) / 100,
    medio: $('f-medio').value,
    comprobantes: $('f-comp').value || null,
    observaciones: $('f-obs').value || null,

  };

/* ---------- VENDEDOR: mis cobros ---------- */
function misRegistros(){
  const local = cola().map(r => ({...r, _local:true}));
  const srv = cache.filter(r => U.rol === 'admin' || r.vendedor === U.usuario);
  return [...local, ...srv].sort((a,b) => (b.fecha||'').localeCompare(a.fecha||''));
}

/* ---- Filtro de período (vendedor) ---- */
let fp = { modo:'hoy', desde:hoy(), hasta:hoy(), cliente:'', medio:'' };

function diasAtras(n){
  const d = new Date(); d.setDate(d.getDate() - n);
  return d.toISOString().slice(0,10);
}
function setPeriodo(modo){
  fp.modo = modo;
  if (modo === 'hoy')      { fp.desde = hoy();            fp.hasta = hoy(); }
  if (modo === 'ayer')     { fp.desde = diasAtras(1);     fp.hasta = diasAtras(1); }
  if (modo === '7')        { fp.desde = diasAtras(6);     fp.hasta = hoy(); }
  if (modo === '15')       { fp.desde = diasAtras(14);    fp.hasta = hoy(); }
  if (modo === '30')       { fp.desde = diasAtras(29);    fp.hasta = hoy(); }
  if (modo === 'mes')      { fp.desde = hoy().slice(0,7)+'-01'; fp.hasta = hoy(); }
  if (modo === 'todo')     { fp.desde = '2000-01-01';     fp.hasta = '2999-12-31'; }
  render();
  if (modo !== 'hoy' && navigator.onLine) traerRango();
}
function setFecha(campo, valor){
  fp.modo = 'rango'; fp[campo] = valor;
  if (fp.desde > fp.hasta) { if (campo === 'desde') fp.hasta = valor; else fp.desde = valor; }
  render(); if (navigator.onLine) traerRango();
}
async function traerRango(){
  if (!db || !navigator.onLine) return;
  let q = db.from('cob_cobranzas').select('*')
            .gte('fecha', fp.desde).lte('fecha', fp.hasta)
            .order('fecha',{ascending:false}).order('id',{ascending:false}).limit(1000);
  if (U.rol !== 'admin') q = q.eq('vendedor', U.usuario);
  const { data } = await q;
  if (!data) return;
  const ids = new Set(data.map(r => r.id));
  cache = [...data, ...cache.filter(r => !ids.has(r.id))];
  render();
}
function enPeriodo(r){
  if (r.fecha < fp.desde || r.fecha > fp.hasta) return false;
  if (fp.medio && r.medio !== fp.medio) return false;
  if (fp.cliente && !norm(r.cliente_nombre).includes(norm(fp.cliente))) return false;
  return true;
}
function setFiltro(campo, valor){ fp[campo] = valor; render(); }
function limpiarFiltros(){ fp.cliente = ''; fp.medio = ''; render(); }

function barraPeriodo(){
  const chips = [['hoy','Hoy'],['ayer','Ayer'],['7','7 días'],['15','15 días'],['30','30 días'],['mes','Este mes'],['todo','Todo']];
  return `<div class="card" style="padding:12px">
    <div class="chips">${chips.map(c =>
      `<button class="chip ${fp.modo===c[0]?'on':''}" onclick="setPeriodo('${c[0]}')">${c[1]}</button>`).join('')}</div>
    <div class="row" style="margin-top:10px">
      <div><label>Desde</label><input type="date" class="input" value="${fp.desde}" onchange="setFecha('desde',this.value)"></div>
      <div><label>Hasta</label><input type="date" class="input" value="${fp.hasta}" onchange="setFecha('hasta',this.value)"></div>
    </div>
    <label>Cliente</label>
    <input class="input" id="fp-cli" value="${esc(fp.cliente)}" placeholder="Escribí parte del nombre…"
           oninput="fp.cliente=this.value;clearTimeout(window._tf);window._tf=setTimeout(render,350)" autocomplete="off">
    <div class="chips" style="margin-top:8px">
      <button class="chip ${!fp.cliente?'on':''}" onclick="fp.cliente='';render()"><i class="fa-solid fa-users"></i> Todos los clientes</button>
      ${fp.cliente?`<button class="chip on" onclick="fp.cliente='';render()">${esc(fp.cliente)} <i class="fa-solid fa-xmark"></i></button>`:''}
    </div>
    <label>Medio de pago</label>
    <select onchange="setFiltro('medio',this.value)">
      <option value="" ${!fp.medio?'selected':''}>Todos los medios</option>
      <option value="efectivo" ${fp.medio==='efectivo'?'selected':''}>Efectivo</option>
      <option value="transferencia" ${fp.medio==='transferencia'?'selected':''}>Transferencia</option>
    </select>
  </div>`;
}

function porMedio(regs){
  const m = {};
  regs.forEach(r => { m[r.medio] = m[r.medio] || { n:0, t:0 }; m[r.medio].n++; m[r.medio].t += Number(r.importe); });
  return Object.entries(m).sort((a,b) => b[1].t - a[1].t);
}
function porCliente(regs){
  const c = {};
  regs.forEach(r => { const k = r.cliente_nombre; c[k] = c[k] || { n:0, t:0 }; c[k].n++; c[k].t += Number(r.importe); });
  return Object.entries(c).sort((a,b) => b[1].t - a[1].t);
}

function porDia(regs){
  const d = {};
  regs.forEach(r => { d[r.fecha] = d[r.fecha] || { n:0, t:0 }; d[r.fecha].n++; d[r.fecha].t += Number(r.importe); });
  return Object.entries(d).sort((a,b) => b[0].localeCompare(a[0]));
}

function vMias(){
  const regs = misRegistros().filter(r => enPeriodo(r) && r.estado !== 'anulado');
  const tot  = regs.reduce((s,r) => s + Number(r.importe), 0);
  const pend = regs.filter(r => r.estado === 'pendiente' || r._local).reduce((s,r) => s + Number(r.importe), 0);
  const dias = porDia(regs), medios = porMedio(regs), clis = porCliente(regs);
  const rotulo = fp.desde === fp.hasta ? fp.desde : `${fp.desde} al ${fp.hasta}`;
  const nomMedio = { efectivo:'Efectivo', transferencia:'Transferencia' };
  const detalle = fp.cliente ? `Cliente: ${esc(fp.cliente)}` : '';

  return barraPeriodo() +
    `<div class="kpi"><div class="lbl">Cobrado · ${rotulo}${fp.medio?' · '+nomMedio[fp.medio]:''}</div>
      <div class="big">${money(tot)}</div>
      <div class="lbl" style="margin-top:6px">${regs.length} cobranza(s) · sin rendir ${money(pend)}</div>
      ${detalle?`<div class="lbl" style="margin-top:3px">${detalle}</div>`:''}</div>

    ${medios.length ? `<div class="card"><h3><i class="fa-solid fa-money-bill-transfer"></i> Por medio de pago</h3>
      ${medios.map(([m,v]) => `<div class="item"><div><div class="nm">${nomMedio[m]||esc(m)}</div>
        <div class="dt">${v.n} cobranza(s) · ${tot?Math.round(v.t/tot*100):0}% del total</div></div>
        <div class="am">${money(v.t)}</div></div>`).join('')}</div>` : ''}

    ${clis.length ? `<div class="card"><h3><i class="fa-solid fa-store"></i> Total por cliente (${clis.length})</h3>
      ${clis.map(([c,v]) => `<div class="item" style="cursor:pointer" onclick="fp.cliente=${JSON.stringify(c).replace(/"/g,'&quot;')};render()">
        <div><div class="nm">${esc(c)}</div><div class="dt">${v.n} cobranza(s)</div></div>
        <div class="am">${money(v.t)}</div></div>`).join('')}
      <div class="item" style="background:var(--primary-light);border:none;margin-top:6px">
        <div class="nm">TOTAL DEL PERÍODO</div><div class="am">${money(tot)}</div></div>
      </div>` : ''}

    ${dias.length > 1 ? `<div class="card"><h3><i class="fa-solid fa-calendar-day"></i> Por día</h3>
      ${dias.map(([f,v]) => `<div class="item"><div><div class="nm">${f}</div><div class="dt">${v.n} cobranza(s)</div></div>
        <div class="am">${money(v.t)}</div></div>`).join('')}</div>` : ''}

    <div class="card" style="padding:12px 14px"><h3 style="margin:0"><i class="fa-solid fa-list"></i> Detalle (${regs.length})</h3></div>
    ${regs.length ? regs.map(fila).join('') : '<div class="empty">Sin cobranzas con estos filtros.</div>'}`;
}
function fila(r){
  const est = r._local ? 'offline' : r.estado;
  return `<div class="item"><div>
      <div class="nm">${esc(r.cliente_nombre)}</div>
      <div class="dt">${r.fecha} · ${esc(r.medio)} ${r.comprobantes?'· '+esc(r.comprobantes):''}</div>
      <span class="tag t-${est}">${est}</span>
    </div><div class="am">${money(r.importe)}</div></div>`;
}

/* ---------- VENDEDOR: rendición con selección ---------- */
let sel = new Set();   // uids seleccionados para rendir

function toggleSel(uid){ sel.has(uid) ? sel.delete(uid) : sel.add(uid); render(); }
function selTodos(uids){ uids.forEach(u => sel.add(u)); render(); }
function selNada(){ sel.clear(); render(); }

function filaSel(r){

    <div style="display:flex;align-items:center;gap:10px">

      <div><div class="nm">${esc(r.cliente_nombre)}</div>
        <div class="dt">${r.fecha}${r.comprobantes?' · '+esc(r.comprobantes):''}</div></div>

}

function vRendicion(){
  const todo = misRegistros().filter(r => r.medio === 'efectivo' && r.estado !== 'anulado');
  const pend = todo.filter(r => r.estado === 'pendiente' || r._local);
  const tot  = pend.reduce((s,r) => s + Number(r.importe), 0);
  const uids = pend.map(r => r.uid || String(r.id));
  const selReg = pend.filter(r => sel.has(r.uid || String(r.id)));
  const totSel = selReg.reduce((s,r) => s + Number(r.importe), 0);
  const hist = todo.filter(r => enPeriodo(r) && !(r.estado === 'pendiente' || r._local));
  const totH = hist.reduce((s,r) => s + Number(r.importe), 0);
  const rotulo = fp.desde === fp.hasta ? fp.desde : `${fp.desde} al ${fp.hasta}`;

  return `<div class="kpi"><div class="lbl">Efectivo en mi poder · a rendir</div><div class="big">${money(tot)}</div>
      <div class="lbl" style="margin-top:6px">${pend.length} cobranza(s)</div></div>

    ${pend.length ? `<div class="card">

      <div class="chips" style="margin-bottom:8px">

        <div style="height:10px"></div>

        : '<p style="font-size:.8rem;color:var(--text-muted);text-align:center;margin-top:8px">Seleccioná al menos una cobranza.</p>'}
      </div>` : '<div class="card"><div class="empty">No hay efectivo pendiente de rendir.</div></div>'}

    <div class="card"><h3><i class="fa-solid fa-clock-rotate-left"></i> Ya rendido</h3>
      <p style="font-size:.78rem;color:var(--text-muted);margin-bottom:8px">Historial para controlar contra tu planilla.</p></div>
    ${barraPeriodo()}
    <div class="mini" style="margin-bottom:12px"><div class="l">Rendido · ${rotulo}</div>
      <div class="v">${money(totH)}</div><div class="l">${hist.length} cobranza(s)</div></div>
    ${hist.length ? hist.map(fila).join('') : '<div class="empty">Sin entregas rendidas en este período.</div>'}`;
}

/* ---- Comprobante de rendición (texto + descarga) ---- */
function comprobanteTexto(regs, quien){
  const tot = regs.reduce((s,r) => s + Number(r.importe), 0);
  const ahora = new Date().toLocaleString('es-AR');
  const L = [];
  L.push('COMPROBANTE DE RENDICIÓN — ' + EMPRESA);
  L.push('Vendedor: ' + quien);
  L.push('Generado: ' + ahora);
  L.push('Cobranzas: ' + regs.length);
  L.push('─────────────────────────────');
  regs.slice().sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''))
     .forEach(r => L.push(`${r.fecha}  ${money(r.importe).padStart(14)}  ${r.cliente_nombre}`));
  L.push('─────────────────────────────');
  L.push('TOTAL EFECTIVO: ' + money(tot));
  L.push('');
  L.push('Firma vendedor: __________   Recibí conformidad: __________');
  return L.join('\n');
}

async function generarComprobante(){
  const pend = misRegistros().filter(r => r.medio === 'efectivo' && (r.estado === 'pendiente' || r._local));
  const regs = pend.filter(r => sel.has(r.uid || String(r.id)));
  if (!regs.length) return toast('No hay cobranzas seleccionadas.');
  const texto = comprobanteTexto(regs, U.nombre);
  abrirComprobante(texto, regs, U.nombre, false);
}

function abrirComprobante(texto, regs, quien, esAdmin){
  const tot = regs.reduce((s,r) => s + Number(r.importe), 0);
  $('cmp-texto').textContent = texto;
  $('cmp-acciones').innerHTML =
    `<button class="btn" onclick="descargarComprobante()"><i class="fa-solid fa-download"></i> Descargar comprobante (.txt)</button>
     <div style="height:8px"></div>
     <button class="btn sec" onclick="copiarComprobante()"><i class="fa-solid fa-copy"></i> Copiar texto</button>
     ${navigator.share?`<div style="height:8px"></div><button class="btn sec" onclick="compartirComprobante()"><i class="fa-solid fa-share-nodes"></i> Compartir</button>`:''}
     ${esAdmin?`<div style="height:8px"></div><button class="btn" style="background:var(--success)" onclick="confirmarRecepcion()"><i class="fa-solid fa-check-double"></i> Confirmar recepción (${regs.length} · ${money(tot)})</button>`:''}`;
  window._cmp = { texto, regs, quien };
  abrir('m-cmp');
}
function descargarComprobante(){
  const { texto, quien } = window._cmp;
  const url = URL.createObjectURL(new Blob([texto], { type:'text/plain;charset=utf-8' }));
  const a = document.createElement('a'); a.href = url;
  a.download = `rendicion_${norm(quien).replace(/\s+/g,'_')}_${hoy()}.txt`; a.click(); URL.revokeObjectURL(url);
  toast('Comprobante descargado.');
}
function copiarComprobante(){ navigator.clipboard.writeText(window._cmp.texto).then(()=>toast('Copiado.')); }
function compartirComprobante(){ navigator.share({ title:'Rendición '+EMPRESA, text:window._cmp.texto }).catch(()=>{}); }

/* ---------- ADMIN: recepción de rendiciones ---------- */
let rec = { vend:'', desde:hoy(), hasta:hoy() };

    <select onchange="rec.vend=this.value;sel.clear();render()">

    <div class="chips" style="margin-top:8px">
      <button class="chip" onclick="rec.desde='2000-01-01';rec.hasta='2999-12-31';render()">Todo lo pendiente</button>
      <button class="chip" onclick="selTodos(${JSON.stringify(uids).replace(/"/g,'&quot;')})">Tildar todo</button>

    <h3>${pend.length} cobranza(s) pendiente(s)</h3>
    ${pend.map(r => filaSelAdmin(r)).join('')}
    ${sel.size ? `<div class="item" style="background:var(--primary);color:#fff;border:none;margin-top:8px">
        <div class="nm" style="color:#fff">A RECIBIR (${selReg.length})</div><div class="am">${money(totSel)}</div></div>
      <div style="height:10px"></div>
      <button class="btn" onclick="verComprobanteAdmin()"><i class="fa-solid fa-receipt"></i> Ver comprobante y confirmar</button>`
      : '<p style="font-size:.8rem;color:var(--text-muted);text-align:center;margin-top:8px">Tildá las cobranzas que estás recibiendo.</p>'}
    </div>`
    : '<div class="card"><div class="empty">No hay efectivo pendiente con esos filtros.</div></div>'}`;

function filaSelAdmin(r){
  const id = String(r.id), marc = sel.has(id);
  return `<div class="item" style="cursor:pointer;${marc?'border-color:var(--primary);background:var(--primary-light)':''}" onclick="toggleSel('${id}')">
    <div style="display:flex;align-items:center;gap:10px">
      <i class="fa-${marc?'solid fa-square-check':'regular fa-square'}" style="font-size:1.3rem;color:${marc?'var(--primary)':'var(--text-muted)'}"></i>
      <div><div class="nm">${esc(r.cliente_nombre)}</div>
        <div class="dt">${r.fecha} · ${esc(r.vendedor_nombre||r.vendedor)}</div></div>
    </div><div class="am">${money(r.importe)}</div></div>`;
}

function verComprobanteAdmin(){
  const pend = cache.filter(r => r.estado === 'pendiente' && sel.has(String(r.id)));
  if (!pend.length) return toast('Nada seleccionado.');
  const quien = [...new Set(pend.map(r => r.vendedor_nombre||r.vendedor))].join(', ');

async function confirmarRecepcion(){
  const regs = window._cmp.regs;
  const ids = regs.map(r => r.id).filter(Boolean);
  if (!ids.length) return toast('No se pudo identificar las cobranzas.');
  const rendicionId = 'REN-' + hoy().replace(/-/g,'') + '-' + Math.random().toString(36).slice(2,5).toUpperCase();
  const { error } = await db.from('cob_cobranzas')
    .update({ estado:'rendido', rendicion:rendicionId }).in('id', ids);
  if (error) return toast('Error: ' + error.message);
  cerrar('m-cmp'); sel.clear();
  await traerCobranzas(); render();
  toast(`Recepción confirmada: ${ids.length} cobranzas.`);
}

/* ---------- ADMIN: panel ---------- */
function vPanel(){

  const pend = act.filter(r => r.estado === 'pendiente');
  const sum = a => a.reduce((s,r) => s + Number(r.importe), 0);
  const porV = {};
  pend.forEach(r => { porV[r.vendedor_nombre||r.vendedor] = (porV[r.vendedor_nombre||r.vendedor]||0) + Number(r.importe); });
  return `<div class="kpi"><div class="lbl">Cobrado hoy</div><div class="big">${money(sum(hoyR))}</div>
      <div class="lbl" style="margin-top:6px">${hoyR.length} operaciones</div></div>
    <div class="grid">
      <div class="mini"><div class="l">Mes ${mes}</div><div class="v">${money(sum(mesR))}</div></div>
      <div class="mini"><div class="l">Sin rendir</div><div class="v" style="color:var(--warn)">${money(sum(pend))}</div></div>
      <div class="mini"><div class="l">Sin exportar</div><div class="v">${money(sum(act.filter(r=>r.estado!=='exportado')))}</div></div>
    </div>
    <div class="card"><h3><i class="fa-solid fa-users"></i> Efectivo en poder de vendedores</h3>
      ${Object.keys(porV).length ? Object.entries(porV).sort((a,b)=>b[1]-a[1]).map(([k,v]) =>
        `<div class="item"><div class="nm">${esc(k)}</div><div class="am">${money(v)}</div></div>`).join('')
        : '<div class="empty">Todo rendido.</div>'}
    </div>`;
}

/* ---------- ADMIN: cobranzas ---------- */
function vCobranzas(){
  const f = filtros;
  let r = cache.filter(x =>
    (!f.desde || x.fecha >= f.desde) && (!f.hasta || x.fecha <= f.hasta) &&
    (!f.vend || x.vendedor === f.vend) && (!f.estado || x.estado === f.estado));
  const tot = r.filter(x => x.estado !== 'anulado').reduce((s,x) => s + Number(x.importe), 0);
  const vends = [...new Set(cache.map(x => x.vendedor))];
  return `<div class="card">
      <div class="row"><div><label>Desde</label><input type="date" class="input" value="${f.desde||''}" onchange="filtros.desde=this.value;render()"></div>
      <div><label>Hasta</label><input type="date" class="input" value="${f.hasta||''}" onchange="filtros.hasta=this.value;render()"></div></div>
      <div class="row"><div><label>Vendedor</label><select onchange="filtros.vend=this.value;render()"><option value="">Todos</option>
        ${vends.map(v => `<option ${f.vend===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div>
      <div><label>Estado</label><select onchange="filtros.estado=this.value;render()"><option value="">Todos</option>
        ${['pendiente','rendido','exportado','anulado'].map(e => `<option ${f.estado===e?'selected':''}>${e}</option>`).join('')}</select></div></div>
    </div>
    <div class="card"><h3>${r.length} registros · ${money(tot)}</h3>
      <div class="scroll"><table><thead><tr><th>Fecha</th><th>Vendedor</th><th>Cliente</th><th class="n">Importe</th><th>Estado</th><th></th></tr></thead><tbody>
      ${r.slice(0,300).map(x => `<tr>
        <td>${x.fecha}</td><td>${esc(x.vendedor)}</td><td>${esc(x.cliente_nombre)}</td>
        <td class="n">${money(x.importe)}</td><td><span class="tag t-${x.estado}">${x.estado}</span></td>
        <td style="white-space:nowrap">
          ${x.estado==='pendiente'?`<button class="btn sm" onclick="marcar(${x.id},'rendido')">Rendir</button>`:''}
          ${x.estado!=='anulado'?`<button class="btn sm dan" onclick="marcar(${x.id},'anulado')">Anular</button>`:''}
        </td></tr>`).join('') || '<tr><td colspan="6" class="empty">Sin registros.</td></tr>'}
      </tbody></table></div></div>`;
}
async function marcar(id, estado){
  if (estado === 'anulado' && !confirm('¿Anular esta cobranza?')) return;
  const { error } = await db.from('cob_cobranzas').update({ estado }).eq('id', id);
  if (error) return toast('Error: ' + error.message);
  await traerCobranzas(); render(); toast('Actualizado.');
}

    </select>
    <label><input type="checkbox" id="e-marcar" checked style="width:auto"> Marcar como exportadas al descargar</label>
    <div style="height:14px"></div>
    <button class="btn" onclick="exportar()"><i class="fa-solid fa-download"></i> Generar CSV</button>

  </div>
  <div class="card"><h3><i class="fa-solid fa-circle-info"></i> Importación en Odoo 18</h3>
    <p style="font-size:.84rem;line-height:1.55;color:var(--text-muted)">
    Contabilidad → diario <b>${DIARIO_ODOO}</b> → <b>Importar extracto</b> y mapear:
    <code>date</code>→Fecha, <code>payment_ref</code>→Etiqueta, <code>partner_id</code>→Empresa,
    <code>amount</code>→Importe, <code>unique_import_id</code>→ID único.<br>

    línea por línea contra las facturas del cliente, igual que Galicia o Mercado Pago.</p></div>`;
}

function csvEsc(v, sep){
  const s = (v == null ? '' : String(v));
  return (s.includes(sep) || s.includes('"') || s.includes('\n')) ? '"' + s.replace(/"/g,'""') + '"' : s;
}

async function exportar(){
  const d = $('e-desde').value, h = $('e-hasta').value;
  const est = $('e-estado').value ? $('e-estado').value.split(',') : null;
  const med = $('e-medio').value, vend = $('e-vend').value, fmt = $('e-fmt').value;
  const diario = $('e-diario').value;

  let q = db.from('cob_cobranzas').select('*').gte('fecha', d).lte('fecha', h).neq('estado','anulado').order('fecha').order('id');
  if (vend) q = q.eq('vendedor', vend);
  if (med) q = q.eq('medio', med);
  if (est) q = q.in('estado', est);
  const { data, error } = await q;
  if (error) return toast('Error: ' + error.message);
  if (!data || !data.length) return toast('No hay cobranzas con esos filtros.');

  let sep, headers, filas, bom = '';
  if (fmt === 'odoo') {
    sep = ',';
    headers = ['date','payment_ref','partner_id','amount','unique_import_id','ref','journal_id'];
    filas = data.map(r => [
      r.fecha,
      `COB EFVO ${r.vendedor_nombre||r.vendedor} - ${r.cliente_nombre}`,
      r.cliente_nombre,
      Number(r.importe).toFixed(2),
      r.uid,
      r.comprobantes || '',
      diario
    ]);
  } else {
    sep = ';'; bom = '\uFEFF';
    headers = ['ID','UID','Fecha','Vendedor','Cliente','Codigo','CUIT','Importe','Medio','Comprobantes','Observaciones','Estado'];
    filas = data.map(r => [r.id, r.uid, r.fecha, r.vendedor_nombre||r.vendedor, r.cliente_nombre, r.cliente_codigo||'',
      r.cliente_cuit||'', Number(r.importe).toFixed(2).replace('.',','), r.medio, r.comprobantes||'', r.observaciones||'', r.estado]);
  }
  const csv = bom + [headers.join(sep), ...filas.map(f => f.map(v => csvEsc(v,sep)).join(sep))].join('\r\n');
  const nombre = `cobranzas_${fmt}_${d}_a_${h}.csv`;
  const url = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8;' }));
  const a = document.createElement('a'); a.href = url; a.download = nombre; a.click(); URL.revokeObjectURL(url);

  const total = data.reduce((s,r) => s + Number(r.importe), 0);
  $('e-prev').innerHTML = `<div class="mini"><div class="l">Exportado</div><div class="v">${money(total)}</div>
    <div class="l">${data.length} líneas · ${nombre}</div></div>`;

  if ($('e-marcar').checked && fmt === 'odoo') {
    const ids = data.map(r => r.id);
    await db.from('cob_cobranzas').update({ estado:'exportado', exportado_at:new Date().toISOString() }).in('id', ids);
    await traerCobranzas();
  }
  toast(`CSV generado: ${data.length} líneas.`);
}

/* ---------- ABM de usuarios ---------- */
async function cargarUsuariosAdmin(){
  const cont = $('u-lista'); if (!cont) return;
  const { data, error } = await db.rpc('cob_admin_usuarios', { p_admin:U.usuario, p_pin_admin:U.pin });
  if (error) { cont.innerHTML = `<div class="empty">No se pudo listar.<br><small>${esc(error.message)}</small></div>`; return; }
  window._admUsuarios = data || [];
  cont.innerHTML = (data||[]).map(u => `<div class="item"><div>
      <div class="nm">${esc(u.nombre)}</div>
      <div class="dt">${esc(u.usuario)} · ${esc(u.rol)}${u.zona?' · '+esc(u.zona):''}</div>
      <span class="tag t-${u.activo?'exportado':'anulado'}">${u.activo?'activo':'baja'}</span>
    </div><div style="white-space:nowrap">
      <button class="btn sm sec" onclick="abrirUsuario('${esc(u.usuario)}')">Editar</button>
    </div></div>`).join('') || '<div class="empty">Sin usuarios.</div>';
}

function abrirUsuario(usuario){
  const u = (window._admUsuarios||[]).find(x => x.usuario === usuario) || null;
  $('u-titulo').textContent = u ? 'Editar usuario' : 'Nuevo usuario';
  $('u-usuario').value = u ? u.usuario : '';
  $('u-usuario').readOnly = !!u;
  $('u-nombre').value = u ? u.nombre : '';
  $('u-pin').value = '';
  $('u-pin-lbl').textContent = u ? 'PIN (vacío = no cambiarlo)' : 'PIN (4 a 6 dígitos)';
  $('u-rol').value = u ? u.rol : 'vendedor';
  $('u-zona').value = u && u.zona ? u.zona : '';
  $('u-activo').checked = u ? u.activo : true;
  abrir('m-user');
}

async function guardarUsuario(){
  const p = {
    p_admin: U.usuario, p_pin_admin: U.pin,
    p_usuario: $('u-usuario').value.trim(),
    p_nombre:  $('u-nombre').value.trim(),
    p_pin:     $('u-pin').value.trim(),
    p_rol:     $('u-rol').value,
    p_zona:    $('u-zona').value.trim(),
    p_activo:  $('u-activo').checked
  };
  if (!p.p_usuario || !p.p_nombre) return toast('Usuario y nombre son obligatorios.');
  if (!U.pin) { toast('Cerrá sesión y volvé a entrar (falta validar tu PIN).'); return; }
  const { data, error } = await db.rpc('cob_admin_guardar_usuario', p);
  if (error) {
    const m = error.message || '';
    if (m.includes('cob_admin_guardar_usuario') || m.includes('does not exist') || m.includes('function'))
      return toast('Falta correr el SQL del paso 2 en Supabase.');
    if (m.includes('No autorizado')) return toast('Tu PIN de admin no validó. Cerrá sesión y reingresá.');
    return toast(m.replace(/^.*?:\s*/, ''));
  }
  cerrar('m-user');
  toast(data || 'Guardado.');
  await cargarUsuariosAdmin();
  await cargarUsuariosLogin();
}

async function importarClientes(){
  const f = $('d-file').files[0];
  if (!f) return toast('Elegí un archivo.');
  $('d-msg').innerHTML = 'Procesando…';
  const txt = await f.text();
  const lineas = txt.split(/\r?\n/).filter(l => l.trim());
  if (lineas.length < 2) { $('d-msg').innerHTML = 'Archivo vacío.'; return; }
  const sep = (lineas[0].match(/;/g)||[]).length >= (lineas[0].match(/,/g)||[]).length ? ';' : ',';
  const cols = lineas[0].replace(/^\uFEFF/,'').split(sep).map(c => norm(c.trim()));
  const ix = n => cols.indexOf(n);
  if (ix('NOMBRE') < 0) { $('d-msg').innerHTML = `<b style="color:var(--danger)">No se encontró la columna "nombre".</b> El encabezado leído fue: ${cols.join(' / ')}`; return; }
  const regs = lineas.slice(1).map(l => {
    const p = l.split(sep).map(x => x.trim().replace(/^"|"$/g,''));
    return { codigo:p[ix('CODIGO')]||null, nombre:p[ix('NOMBRE')]||'', cuit:p[ix('CUIT')]||null,
             localidad:p[ix('LOCALIDAD')]||null, vendedor:p[ix('VENDEDOR')]||null, activo:true };
  }).filter(r => r.nombre);
  if (!regs.length) { $('d-msg').innerHTML = 'No se detectaron filas con nombre.'; return; }
  if ($('d-reem').checked) {
    const { error } = await db.from('cob_clientes').update({ activo:false }).neq('id', 0);
    if (error) { $('d-msg').innerHTML = `<b style="color:var(--danger)">No se pudo limpiar la cartera:</b> ${esc(error.message)}<br><small>Si dice permisos/policy, corré el SQL de permisos.</small>`; return; }
  }
  let ok = 0, ultimoError = null;
  for (let i = 0; i < regs.length; i += 500) {
    const { error } = await db.from('cob_clientes').insert(regs.slice(i, i+500));
    if (!error) ok += regs.slice(i, i+500).length; else ultimoError = error;
  }
  if (ok === 0 && ultimoError) {
    $('d-msg').innerHTML = `<b style="color:var(--danger)">No se importó ningún cliente.</b><br>Motivo: ${esc(ultimoError.message)}<br><small>Casi seguro es permiso de escritura: ejecutá el SQL de permisos en Supabase.</small>`;
    return;
  }
  $('d-msg').innerHTML = `<b style="color:var(--success)">${ok}</b> clientes importados de ${regs.length}.` +
    (ok < regs.length ? `<br><small style="color:var(--warn)">${regs.length-ok} fallaron: ${esc(ultimoError?ultimoError.message:'')}</small>` : '');
  await cargarClientes(true); render(); toast(`Importados ${ok} clientes.`);
}
